<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tracker</title>
<meta name="theme-color" id="metaThemeColor" content="#FFF2FB" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23FF7FC4'/%3E%3Cstop%20offset='0.5'%20stop-color='%23B488FF'/%3E%3Cstop%20offset='1'%20stop-color='%236FE9C0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%231A1030'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='14'%20fill='url(%23g)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Candy accents — light */
  --peach-l:      #FF7FC4;   /* bubblegum */
  --rosa-l:       #B488FF;   /* lilac     */
  --minze-l:      #6FE9C0;   /* mint      */
  --buttermilk-l: #FFD15C;   /* butter    */
  --violet-l:     #6FD2FF;   /* sky       */

  /* Candy accents — dark (brighter / neon) */
  --peach-d:      #FF9AD6;
  --rosa-d:       #C4A2FF;
  --minze-d:      #7FF0CE;
  --buttermilk-d: #FFDD7A;
  --violet-d:     #8FDBFF;

  /* Trend / status (theme-independent) */
  --trend-up:      #FF5FA0;
  --trend-down:    #2FD39E;
  --danger:        #FF5C8A;
  --danger-strong: #E23A6E;

  /* Type */
  --font-display: 'Baloo 2', 'Quicksand', system-ui, sans-serif;
  --font-body:    'Quicksand', system-ui, -apple-system, sans-serif;

  /* Radii (chunky) */
  --radius-sm:   12px;
  --radius-md:   16px;
  --radius-lg:   20px;
  --radius-xl:   26px;
  --radius-2xl:  30px;
  --radius-pill: 999px;
  --radius-full: 50%;

  /* Motion */
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

[data-theme="light"] {
  --peach:      var(--peach-l);
  --rosa:       var(--rosa-l);
  --minze:      var(--minze-l);
  --buttermilk: var(--buttermilk-l);
  --violet:     var(--violet-l);

  --peach-tint:      #FFD9EF;
  --rosa-tint:       #E7DBFF;
  --minze-tint:      #D2F8EC;
  --buttermilk-tint: #FFEFC4;
  --violet-tint:     #D4F1FF;

  --peach-grad:      linear-gradient(150deg, #FF9AD2, #FF7FC4);
  --rosa-grad:       linear-gradient(150deg, #C9A6FF, #B488FF);
  --minze-grad:      linear-gradient(150deg, #9FF3D8, #6FE9C0);
  --buttermilk-grad: linear-gradient(150deg, #FFE08A, #FFD15C);
  --violet-grad:     linear-gradient(150deg, #9FE3FF, #6FD2FF);

  --bg:        #FFF2FB;
  --surface:   #FFFFFF;
  --surface-2: #FCEFF9;
  --line:      #F3DCEF;
  --line-2:    #ECC7E6;
  --text:      #4A2D63;   /* deep grape */
  --text-2:    #8A6BA8;
  --text-3:    #B79ECE;

  --on-accent: #FFFFFF;

  --holo: linear-gradient(110deg, #FF7FC4 0%, #B488FF 28%, #6FD2FF 52%, #6FE9C0 74%, #FFD15C 100%);

  --shadow-1: 0 12px 26px -8px rgba(180, 100, 200, 0.34);
  --shadow-3: 0 26px 56px -14px rgba(180, 100, 200, 0.45);
  --glow-peach:      0 20px 42px -10px rgba(255, 127, 196, 0.60);
  --glow-rosa:       0 20px 42px -10px rgba(180, 136, 255, 0.60);
  --glow-minze:      0 20px 42px -10px rgba(111, 233, 192, 0.60);
  --glow-buttermilk: 0 20px 42px -10px rgba(255, 209, 92, 0.60);
  --glow-violet:     0 20px 42px -10px rgba(111, 210, 255, 0.60);

  --glass-cap:  rgba(255, 255, 255, 0.92);
  --glass-hi:   rgba(255, 255, 255, 1);
  --glass-ring: rgba(255, 255, 255, 0.6);
  --inner-bottom:      rgba(74, 45, 99, 0.32);
  --inner-bottom-soft: rgba(74, 45, 99, 0.12);
}

[data-theme="dark"] {
  --peach:      var(--peach-d);
  --rosa:       var(--rosa-d);
  --minze:      var(--minze-d);
  --buttermilk: var(--buttermilk-d);
  --violet:     var(--violet-d);

  --peach-tint:      #3A1F38;
  --rosa-tint:       #2E2350;
  --minze-tint:      #16352C;
  --buttermilk-tint: #3A2F18;
  --violet-tint:     #16314A;

  --peach-grad:      linear-gradient(150deg, #FF9AD6, #E86FB8);
  --rosa-grad:       linear-gradient(150deg, #C4A2FF, #9B6FF0);
  --minze-grad:      linear-gradient(150deg, #7FF0CE, #4FD3A8);
  --buttermilk-grad: linear-gradient(150deg, #FFDD7A, #F0BE4A);
  --violet-grad:     linear-gradient(150deg, #8FDBFF, #5FB8F0);

  --bg:        #1A1030;   /* deep indigo-purple */
  --surface:   #271A45;
  --surface-2: #322155;
  --line:      #3D2C66;
  --line-2:    #503D80;
  --text:      #F3E9FF;
  --text-2:    #C3AEE6;
  --text-3:    #8E78B8;

  --on-accent: #1A1030;

  --holo: linear-gradient(110deg, #FF9AD6 0%, #C4A2FF 28%, #8FDBFF 52%, #7FF0CE 74%, #FFDD7A 100%);

  --shadow-1: 0 12px 26px -8px rgba(0, 0, 0, 0.55);
  --shadow-3: 0 28px 58px -14px rgba(0, 0, 0, 0.72);
  --glow-peach:      0 20px 44px -10px rgba(255, 154, 214, 0.55);
  --glow-rosa:       0 20px 44px -10px rgba(196, 162, 255, 0.55);
  --glow-minze:      0 20px 44px -10px rgba(127, 240, 206, 0.50);
  --glow-buttermilk: 0 20px 44px -10px rgba(255, 221, 122, 0.50);
  --glow-violet:     0 20px 44px -10px rgba(143, 219, 255, 0.55);

  /* Gloss dimmed to soft bluish "moonlight" so it doesn't glare */
  --glass-cap:  rgba(198, 212, 255, 0.16);
  --glass-hi:   rgba(198, 212, 255, 0.20);
  --glass-ring: rgba(198, 212, 255, 0.08);
  --inner-bottom:      rgba(0, 0, 0, 0.38);
  --inner-bottom-soft: rgba(0, 0, 0, 0.20);
}

/* Zone → accent + gloss ink mapping */
.zone-peach      { --zone: var(--peach);      --zone-tint: var(--peach-tint);      --zone-grad: var(--peach-grad);      --zone-glow: var(--glow-peach);      --on-grad: #8E1556; --on-grad-sh: rgba(255,255,255,0.45); }
.zone-rosa       { --zone: var(--rosa);       --zone-tint: var(--rosa-tint);       --zone-grad: var(--rosa-grad);       --zone-glow: var(--glow-rosa);       --on-grad: #4C2299; --on-grad-sh: rgba(255,255,255,0.45); }
.zone-minze      { --zone: var(--minze);      --zone-tint: var(--minze-tint);      --zone-grad: var(--minze-grad);      --zone-glow: var(--glow-minze);      --on-grad: #0A7A58; --on-grad-sh: rgba(255,255,255,0.5); }
.zone-buttermilk { --zone: var(--buttermilk); --zone-tint: var(--buttermilk-tint); --zone-grad: var(--buttermilk-grad); --zone-glow: var(--glow-buttermilk); --on-grad: #8A5E00; --on-grad-sh: rgba(255,255,255,0.5); }
.zone-violet     { --zone: var(--violet);     --zone-tint: var(--violet-tint);     --zone-grad: var(--violet-grad);     --zone-glow: var(--glow-violet);     --on-grad: #115F86; --on-grad-sh: rgba(255,255,255,0.5); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { background: var(--bg); }
body {
  background:
    radial-gradient(900px 520px at 12% -5%, var(--rosa-tint), transparent 60%),
    radial-gradient(820px 480px at 96% 6%, var(--violet-tint), transparent 55%),
    radial-gradient(720px 620px at 60% 112%, var(--minze-tint), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color 0.35s ease, color 0.35s ease;
  min-height: 100vh;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; font-size: inherit; }
button:focus-visible {
  outline: 2px solid var(--zone, var(--rosa));
  outline-offset: 3px;
}

input, select, textarea {
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  box-shadow: inset 0 3px 4px var(--glass-hi), inset 0 0 0 1px var(--glass-ring);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--zone, var(--rosa));
  box-shadow: 0 0 0 4px var(--zone-tint, var(--rosa-tint)), inset 0 3px 4px var(--glass-hi);
}
input::placeholder { color: var(--text-3); font-weight: 500; }

select {
  appearance: none;
  -webkit-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--text-2) 50%),
    linear-gradient(135deg, var(--text-2) 50%, transparent 50%),
    linear-gradient(180deg, var(--surface), var(--surface-2));
  background-position: calc(100% - 18px) center, calc(100% - 13px) center, 0 0;
  background-size: 5px 5px, 5px 5px, 100% 100%;
  background-repeat: no-repeat;
  padding-right: 36px;
  cursor: pointer;
}

input[type="date"], input[type="time"] { color-scheme: light dark; }
[data-theme="dark"] input[type="date"], [data-theme="dark"] input[type="time"] { color-scheme: dark; }
[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator,
[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1) brightness(1.9); opacity: 0.95; }

::selection { background: var(--zone-tint, var(--rosa-tint)); color: var(--text); }

.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 36px 36px 80px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 28px;
  margin-bottom: 32px;
  border-bottom: 2px solid var(--line);
}

.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 1px;
  color: var(--text);
}
.brand-mark {
  font-weight: 800;
  font-size: 28px;
  line-height: 1;
  background: var(--holo);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.theme-btn {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 2px solid var(--line);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-1), inset 0 3px 4px var(--glass-hi);
  transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s var(--ease-bounce);
}
.theme-btn:hover { color: var(--text); border-color: var(--rosa); transform: translateY(-2px) scale(1.06); }
.theme-btn:active { transform: scale(0.95); }
.theme-btn svg { width: 17px; height: 17px; }
.header-actions { display: flex; gap: 10px; align-items: center; }

.tabs {
  display: inline-flex;
  gap: 6px;
  margin-bottom: 48px;
  padding: 6px;
  border-radius: var(--radius-pill);
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1), inset 0 3px 4px var(--glass-hi), inset 0 0 0 1px var(--glass-ring);
}
.tab {
  padding: 10px 26px;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--text-2);
  letter-spacing: 0.01em;
  border-radius: var(--radius-pill);
  position: relative;
  transition: color 0.2s ease, transform 0.2s var(--ease-bounce);
}
.tab:hover { color: var(--text); }
.tab.active {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  color: var(--on-grad);
  text-shadow: 0 1px 0 var(--on-grad-sh);
}
.tab[data-tab="expenses"].active {
  background: var(--peach-grad);
  box-shadow: var(--glow-peach), inset 0 3px 4px var(--glass-hi), inset 0 -8px 14px var(--inner-bottom), inset 0 0 0 1px var(--glass-ring);
  --on-grad: #8E1556; --on-grad-sh: rgba(255,255,255,0.45);
}
.tab[data-tab="events"].active {
  background: var(--minze-grad);
  box-shadow: var(--glow-minze), inset 0 3px 4px var(--glass-hi), inset 0 -8px 14px var(--inner-bottom), inset 0 0 0 1px var(--glass-ring);
  --on-grad: #0A7A58; --on-grad-sh: rgba(255,255,255,0.5);
}
.tab.active::before {
  content: '';
  position: absolute;
  z-index: -1;
  top: 2px; left: 9%; right: 9%;
  height: 46%;
  border-radius: inherit;
  background: linear-gradient(180deg, var(--glass-cap), rgba(255,255,255,0));
}

.section {
  margin-bottom: 64px;
}
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--line);
  gap: 16px;
  flex-wrap: wrap;
}
.section-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: -0.01em;
  line-height: 1;
  color: var(--text);
}
.section-title em {
  font-style: normal;
  color: var(--zone, var(--peach));
}
.section-meta {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
}

/* =========================================================
   KARTEN — fest 3 Stück, kein "+ Neu"
   ========================================================= */
.cards-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.cc {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 150px;
  padding: 22px;
  border-radius: var(--radius-xl);
  color: var(--on-grad);
  text-shadow: 0 1px 0 var(--on-grad-sh);
  background:
    radial-gradient(120% 95% at 50% -16%, var(--glass-cap), rgba(255,255,255,0.1) 44%, rgba(255,255,255,0) 60%),
    var(--zone-grad, var(--peach-grad));
  box-shadow: var(--zone-glow, var(--glow-peach)), inset 0 4px 4px var(--glass-hi), inset 0 -10px 16px var(--inner-bottom), inset 0 0 0 1px var(--glass-ring);
  transition: transform 0.25s var(--ease-bounce), filter 0.2s ease, box-shadow 0.2s ease;
}
.cc::before {
  content: '';
  position: absolute;
  z-index: -1;
  top: 3px; left: 9%; right: 9%;
  height: 48%;
  border-radius: inherit;
  background: linear-gradient(180deg, var(--glass-cap), rgba(255,255,255,0.15) 70%, rgba(255,255,255,0));
}
.cc::after {
  content: '';
  position: absolute;
  z-index: -1;
  inset: 0;
  border-radius: inherit;
  background: var(--holo);
  opacity: 0.6;
  mix-blend-mode: screen;
  -webkit-mask: radial-gradient(160% 115% at 50% -38%, transparent 46%, #000 82%);
          mask: radial-gradient(160% 115% at 50% -38%, transparent 46%, #000 82%);
}
.cc:hover { transform: translateY(-3px) scale(1.025); filter: brightness(1.04) saturate(1.08); }
.cc.selected {
  box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--zone), var(--zone-glow), inset 0 4px 4px var(--glass-hi), inset 0 -10px 16px var(--inner-bottom);
}
.cc-sparkle {
  position: absolute;
  bottom: 12px; right: 16px;
  font-size: 44px;
  line-height: 1;
  color: var(--on-grad);
  opacity: 0.16;
  z-index: 0;
  pointer-events: none;
}
.cc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 1;
}
.cc-type-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--on-grad);
}
.cc-logo {
  height: 18px;
  display: flex;
  align-items: center;
  color: var(--on-grad);
  opacity: 0.85;
  flex-shrink: 0;
}
.cc-logo svg { height: 100%; width: auto; }
.cc-amount {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-top: auto;
  line-height: 1;
  color: var(--on-grad);
  position: relative;
  z-index: 1;
}
.cc-month {
  font-size: 10px;
  color: var(--on-grad);
  opacity: 0.78;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  margin-top: 6px;
}
.cc-pending {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 12px;
  color: var(--on-grad);
  opacity: 0.92;
  margin-top: 8px;
  line-height: 1.3;
}

.month-nav {
  display: flex;
  align-items: center;
  gap: 12px;
}
.month-nav-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 2px solid var(--line);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-1), inset 0 3px 4px var(--glass-hi);
  font-size: 18px;
  font-weight: 700;
  transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s var(--ease-bounce);
}
.month-nav-btn:hover { color: var(--text); border-color: var(--peach); transform: scale(1.08); }
.month-nav-btn:active { transform: scale(0.94); }
.month-today-btn {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--on-grad, #8E1556);
  background: var(--peach-grad);
  border: none;
  border-radius: var(--radius-pill);
  padding: 7px 16px;
  text-shadow: 0 1px 0 rgba(255,255,255,0.45);
  box-shadow: var(--glow-peach), inset 0 3px 4px var(--glass-hi), inset 0 -6px 10px var(--inner-bottom);
  transition: transform 0.2s var(--ease-bounce), filter 0.2s ease;
}
.month-today-btn:hover { transform: translateY(-1px) scale(1.04); filter: brightness(1.04); }
.month-label {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  min-width: 150px;
  text-align: center;
  letter-spacing: -0.01em;
  color: var(--text);
}

.form-grid {
  display: grid;
  grid-template-columns: 2fr 1.2fr 1fr;
  column-gap: 20px;
  row-gap: 16px;
}
.form-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 20px;
  row-gap: 16px;
  margin-top: 16px;
}
.field-stack {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.field-label {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
}
.form-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  gap: 16px;
  flex-wrap: wrap;
}
.recurring-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
}
.recurring-toggle input { width: auto; padding: 0; border: none; background: none; box-shadow: none; accent-color: var(--zone, var(--rosa)); cursor: pointer; }

/* Buttons — Glass-Bubble-Rezept exakt nach glass-look-reference.html.
   ALLE Buttons sind Glass-Pills (Glanz-Kappe via ::before); Primary trägt
   zusätzlich die Holo-Lichtbrechung (::after). */
.btn {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  padding: 15px 30px;
  border-radius: var(--radius-pill);
  letter-spacing: 0.01em;
  transition: transform 0.15s var(--ease-bounce), box-shadow 0.22s ease, filter 0.22s ease, color 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn::before {
  content: '';
  position: absolute;
  z-index: -1;
  top: 3px; left: 9%; right: 9%;
  height: 50%;
  border-radius: var(--radius-pill);
  background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 70%, rgba(255,255,255,0));
  pointer-events: none;
}
.btn:active { transform: scale(0.97); }
.btn .sparkle { filter: drop-shadow(0 1px 0 var(--on-grad-sh, rgba(255,255,255,0.4))); }

.btn-primary {
  padding: 17px 34px;
  color: var(--on-grad, #3A2150);
  text-shadow: 0 1px 0 var(--on-grad-sh, rgba(255,255,255,0.45));
  background:
    radial-gradient(120% 90% at 50% -20%, rgba(255,255,255,0.95), rgba(255,255,255,0.1) 42%, rgba(255,255,255,0) 58%),
    var(--zone-grad, var(--holo));
  box-shadow:
    0 16px 30px -8px color-mix(in srgb, var(--zone, #B488FF) 65%, transparent),
    inset 0 4px 4px rgba(255,255,255,1),
    inset 0 -14px 22px rgba(74,45,99,0.34),
    inset 0 2px 0 rgba(255,255,255,0.9),
    inset 0 0 0 1px rgba(255,255,255,0.55);
}
.btn-primary::after {
  content: '';
  position: absolute;
  z-index: -1;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: var(--holo);
  opacity: 0.7;
  mix-blend-mode: screen;
  -webkit-mask: radial-gradient(160% 115% at 50% -38%, transparent 46%, #000 82%);
          mask: radial-gradient(160% 115% at 50% -38%, transparent 46%, #000 82%);
}
.btn-primary:hover { transform: translateY(-3px) scale(1.045); filter: brightness(1.06) saturate(1.12); }

.btn-ghost {
  color: var(--text-2);
  background:
    radial-gradient(135% 100% at 50% -16%, rgba(255,255,255,0.85), rgba(255,255,255,0) 56%),
    var(--surface-2);
  box-shadow:
    0 6px 14px -8px rgba(74,45,99,0.3),
    inset 0 2px 2px rgba(255,255,255,0.85),
    inset 0 -5px 9px rgba(74,45,99,0.12),
    inset 0 0 0 1px var(--line);
}
.btn-ghost:hover { color: var(--text); transform: translateY(-2px) scale(1.03); }

.btn-danger {
  color: var(--danger-strong);
  background:
    radial-gradient(135% 100% at 50% -16%, rgba(255,255,255,0.85), rgba(255,255,255,0) 56%),
    color-mix(in srgb, var(--danger) 18%, var(--surface));
  box-shadow:
    0 8px 16px -8px color-mix(in srgb, var(--danger) 40%, transparent),
    inset 0 2px 2px rgba(255,255,255,0.85),
    inset 0 -5px 9px color-mix(in srgb, var(--danger) 14%, transparent),
    inset 0 0 0 1px color-mix(in srgb, var(--danger) 28%, transparent);
}
.btn-danger:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.03); }

.stats-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  margin-bottom: 32px;
}
.stat {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 18px 20px;
  border-radius: var(--radius-xl);
  color: var(--on-grad);
  background:
    radial-gradient(120% 95% at 50% -16%, var(--glass-cap), rgba(255,255,255,0.1) 44%, rgba(255,255,255,0) 60%),
    var(--zone-grad, var(--buttermilk-grad));
  box-shadow: var(--zone-glow, var(--glow-buttermilk)), inset 0 4px 4px var(--glass-hi), inset 0 -9px 14px var(--inner-bottom), inset 0 0 0 1px var(--glass-ring);
}
.stat::before {
  content: '';
  position: absolute;
  z-index: -1;
  top: 3px; left: 8%; right: 8%;
  height: 46%;
  border-radius: inherit;
  background: linear-gradient(180deg, var(--glass-cap), rgba(255,255,255,0));
}
.stat-label {
  font-size: 11px;
  color: var(--on-grad);
  opacity: 0.85;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 5px;
}
/* ✦ sitzt inline am Label-Ende — überlappt nie den Text */
.stat-spark { flex-shrink: 0; opacity: 0.85; }
.stat-value {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
  color: var(--on-grad);
  text-shadow: 0 1px 0 var(--on-grad-sh);
}
.stat-trend-up   { color: var(--on-grad); }
.stat-trend-down { color: var(--on-grad); }

.chart {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.bar-row {
  display: grid;
  grid-template-columns: 170px 1fr 90px;
  gap: 16px;
  align-items: center;
  font-size: 14px;
}
.bar-cat { color: var(--text); font-weight: 600; }
.bar-track {
  height: 10px;
  background: var(--surface-2);
  border-radius: var(--radius-pill);
  overflow: hidden;
  box-shadow: inset 0 1px 3px var(--inner-bottom-soft);
}
.bar-fill {
  height: 100%;
  background: var(--buttermilk-grad);
  border-radius: var(--radius-pill);
  box-shadow: inset 0 2px 2px var(--glass-hi);
  transition: width 0.7s var(--ease-out);
}
.bar-amount {
  text-align: right;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--text-2);
  letter-spacing: -0.01em;
}

.expense-list-wrap {
  background: transparent;
  border: none;
  padding: 0;
}
.expense-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.exp-item {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 20px;
  align-items: center;
  padding: 16px 20px;
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: 0 14px 26px -12px var(--inner-bottom), inset 0 4px 4px var(--glass-hi), inset 0 0 0 1px var(--glass-ring);
  transition: transform 0.2s var(--ease-bounce);
}
.exp-item::before {
  content: '';
  position: absolute;
  z-index: -1;
  top: 3px; left: 6%; right: 6%;
  height: 46%;
  border-radius: inherit;
  background: linear-gradient(180deg, var(--glass-cap), rgba(255,255,255,0));
}
.exp-item:hover { transform: translateY(-2px); }
.exp-main {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}
.exp-emoji {
  font-size: 18px;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  border-radius: var(--radius-full);
  box-shadow: inset 0 2px 3px var(--glass-hi);
  flex-shrink: 0;
}
.exp-text { min-width: 0; }
.exp-desc {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  word-break: break-word;
  overflow-wrap: anywhere;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.exp-meta {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-weight: 500;
}
.booking-hint {
  color: var(--text-2);
  font-weight: 600;
  font-size: 12px;
}
.eigen-hint {
  color: var(--minze);
  font-weight: 700;
  font-size: 12px;
}
.cc-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}
.cc-pill::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--pill-color, var(--peach));
  box-shadow: 0 0 6px var(--pill-color, var(--peach));
}
.exp-amount {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
  white-space: nowrap;
  color: var(--text);
}
.recurring-tag {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #115F86;
  background: var(--violet-grad);
  text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  line-height: 1;
}
[data-theme="dark"] .recurring-tag { color: #08374F; }
.exp-del {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  font-size: 16px;
  border-radius: var(--radius-full);
  transition: color 0.2s ease, background 0.2s ease, transform 0.2s var(--ease-bounce);
  opacity: 0;
}
.exp-item:hover .exp-del { opacity: 1; }
.exp-del:hover { color: var(--danger); background: var(--peach-tint); transform: scale(1.1); }

.quick-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 8px;
  margin-bottom: 24px;
}
.qt {
  --qt: var(--minze);
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--qt) 16%, var(--surface));
  border: 1.5px solid transparent;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  transition: transform 0.2s var(--ease-bounce), border-color 0.18s ease, color 0.18s ease;
}
.qt:hover { transform: translateY(-2px) scale(1.03); border-color: var(--qt); }
/* Jeder Quick-Tag trägt seine Termin-Farbe */
.qt[data-color="peach"]      { --qt: var(--peach); }
.qt[data-color="rosa"]       { --qt: var(--rosa); }
.qt[data-color="minze"]      { --qt: var(--minze); }
.qt[data-color="buttermilk"] { --qt: var(--buttermilk); }
.qt[data-color="violet"]     { --qt: var(--violet); }
/* Dark mode: kräftiger tönen, sonst zu dunkel */
[data-theme="dark"] .qt { background: color-mix(in srgb, var(--qt) 28%, var(--surface-2)); }
/* Aktiv: glossy Termin-Farbe — zeigt direkt, wie der Termin aussehen wird */
.qt.active {
  color: var(--qt-on, #0A7A58);
  background: var(--qt-grad, var(--minze-grad));
  border-color: transparent;
  text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  box-shadow: inset 0 3px 4px var(--glass-hi), inset 0 -6px 10px var(--inner-bottom);
}
.qt.active[data-color="peach"]      { --qt-grad: var(--peach-grad);      --qt-on: #8E1556; }
.qt.active[data-color="rosa"]       { --qt-grad: var(--rosa-grad);       --qt-on: #4C2299; }
.qt.active[data-color="minze"],
.qt.active:not([data-color])        { --qt-grad: var(--minze-grad);      --qt-on: #0A7A58; }
.qt.active[data-color="buttermilk"] { --qt-grad: var(--buttermilk-grad); --qt-on: #8A5E00; }
.qt.active[data-color="violet"]     { --qt-grad: var(--violet-grad);     --qt-on: #115F86; }

.week {
  margin-bottom: 56px;
}
.week-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line);
}
.week-name {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
  color: var(--text);
}
.week-name em { font-style: normal; color: var(--rosa); }
.week-name.current em { color: var(--violet); }
.week-range {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
}

.day-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 12px;
}
.day {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 12px 10px;
  min-height: 132px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 22px -14px var(--inner-bottom), inset 0 3px 4px var(--glass-hi), inset 0 0 0 1px var(--glass-ring);
  transition: transform 0.2s var(--ease-bounce);
}
.day:hover { transform: translateY(-2px); }
.day.today {
  border-color: transparent;
  color: var(--on-grad, #0A7A58);
  background:
    radial-gradient(120% 80% at 50% -10%, var(--glass-cap), rgba(255,255,255,0) 55%),
    var(--minze-grad);
  box-shadow: var(--glow-minze), inset 0 4px 4px var(--glass-hi), inset 0 -8px 14px var(--inner-bottom);
}
.day-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.day.today .day-head { border-color: rgba(10,122,88,0.25); }
.day-name {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
}
.day.today .day-name { color: var(--on-grad, #0A7A58); }
.day.today .day-name::after { content: ' — heute'; }
.day.today .day-num { color: var(--on-grad, #0A7A58); }
.day-num {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 0.9;
  color: var(--text);
}
.events-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.evt {
  background: color-mix(in srgb, var(--evt-color, var(--minze)) 18%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--evt-color, var(--minze)) 30%, transparent);
  border-left: 4px solid var(--evt-color, var(--minze));
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 12px;
  cursor: pointer;
  transition: transform 0.18s var(--ease-bounce);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
[data-theme="dark"] .evt { background: color-mix(in srgb, var(--evt-color, var(--minze)) 30%, var(--surface-2)); }
.evt:hover { transform: translateX(3px) scale(1.02); }
.evt-time {
  font-size: 10px;
  color: var(--text-2);
  font-weight: 700;
  letter-spacing: 0.02em;
}
.evt-text {
  color: var(--text);
  font-weight: 600;
  word-break: break-word;
  overflow-wrap: anywhere;
  white-space: normal;
  line-height: 1.3;
}
.evt-recurring {
  font-size: 9px;
  color: var(--text-3);
  font-weight: 600;
  letter-spacing: 0.02em;
  margin-top: 2px;
}

/* Farb-Picker im Termin-Formular */
.evt-color-row {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 6px 0;
  flex-wrap: wrap;
}
.evt-color-pick {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.18s var(--ease-bounce);
  position: relative;
  background: var(--surface-2);
  box-shadow: inset 0 2px 3px var(--glass-hi);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  font-family: var(--font-display);
}
.evt-color-pick::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid var(--text);
  opacity: 0;
}
.evt-color-pick:hover { transform: scale(1.15) rotate(-6deg); }
.evt-color-pick.active::after { opacity: 1; }
.evt-color-auto { font-style: normal; }
.day-add {
  margin-top: auto;
  padding-top: 8px;
  font-size: 18px;
  color: var(--text-3);
  background: transparent;
  text-align: center;
  border-radius: var(--radius-sm);
  font-weight: 600;
  line-height: 1;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s ease, background 0.2s ease;
}
.day-add:hover { color: var(--minze); background: var(--minze-tint); }
.day.today .day-add { color: var(--on-grad, #0A7A58); opacity: 0.7; }
.day.today .day-add:hover { background: rgba(255,255,255,0.25); opacity: 1; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(26, 16, 48, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}
[data-theme="dark"] .modal-bg { background: rgba(0, 0, 0, 0.6); }
.modal-bg.open { display: flex; }
.modal {
  position: relative;
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  border-radius: var(--radius-2xl);
  padding: 32px;
  max-width: 460px;
  width: 100%;
  box-shadow: var(--shadow-3), inset 0 4px 4px var(--glass-hi), inset 0 0 0 1px var(--glass-ring);
  max-height: 90vh;
  overflow-y: auto;
}
.modal-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 24px;
  color: var(--text);
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  margin-top: 28px;
  flex-wrap: wrap;
  row-gap: 8px;
}
.modal-info {
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.6;
}
.modal-info-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.modal-info-row:last-child { border: none; }
.modal-info-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-3);
  min-width: 74px;
  font-weight: 700;
}
.modal-note {
  font-size: 13px;
  color: var(--text-2);
  font-weight: 600;
}

.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-3);
  font-size: 14px;
  font-weight: 600;
}
.empty::before {
  content: '✦';
  display: block;
  font-size: 30px;
  line-height: 1;
  margin-bottom: 8px;
  background: var(--holo);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

/* Validierungs-Feedback */
.input-error {
  border-color: var(--danger) !important;
  animation: shake 0.3s ease;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

/* Toast — kurze Bestätigung nach Aktionen, mit Holo-Rand */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  color: var(--text);
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  padding: 12px 22px;
  border: 2px solid transparent;
  border-radius: var(--radius-pill);
  background:
    linear-gradient(180deg, var(--surface), var(--surface-2)) padding-box,
    var(--holo) border-box;
  box-shadow: var(--shadow-3);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s var(--ease-bounce);
  z-index: 200;
  max-width: calc(100vw - 40px);
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 880px) {
  .app { padding: 24px 20px 60px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid-2 { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .stats-row .stat:last-child { grid-column: span 2; }
  .day-grid { grid-template-columns: repeat(2, 1fr); }
  .day-grid .day:last-child { grid-column: span 2; }
  .day { min-height: 100px; }
  .bar-row { grid-template-columns: 110px 1fr 70px; gap: 10px; font-size: 12px; }
  .topbar { flex-direction: column; align-items: flex-start; gap: 16px; }
  .section-title { font-size: 24px; }
  .section-head { flex-direction: column; align-items: flex-start; }
  .cards-row { grid-template-columns: 1fr; }
  .stat { padding: 16px 18px; }
  .stat-value { font-size: 24px; }
  .qt { padding: 10px 16px; }
}
@media (min-width: 881px) and (max-width: 1100px) {
  .stat { padding: 16px 16px; }
  .stat-value { font-size: 22px; }
  .bar-row { grid-template-columns: 140px 1fr 80px; }
}

/* Touch-Geräte: kein Hover — Lösch-X immer sichtbar, größere Tippflächen */
@media (hover: none) {
  .exp-del { opacity: 1; }

@media (prefers-reduced-motion: reduce) {

<script>
const STORAGE_KEY = 'nicole_tracker_v2';   // <- neuer Key, alter Stand wird ignoriert

/* =========================================================
   FESTE KARTEN — werden nicht angelegt, sind einfach da
   ========================================================= */
const CARDS = [
  { id: 'amex', name: 'Amex',      color: 'peach',      logo: 'amex' },
  { id: 'visa', name: 'Visa',      color: 'rosa',       logo: 'visa' },
  { id: 'giro', name: 'Girokonto', color: 'minze',      logo: 'giro' }
];

const COLOR_TINT_VAR = {
  peach:      'var(--peach-tint)',
  rosa:       'var(--rosa-tint)',
  minze:      'var(--minze-tint)',
  buttermilk: 'var(--buttermilk-tint)',
  violet:     'var(--violet-tint)'
};

const COLOR_VAR = {
  peach:      'var(--peach)',
  rosa:       'var(--rosa)',
  minze:      'var(--minze)',
  buttermilk: 'var(--buttermilk)',
  violet:     'var(--violet)'
};

const CARD_LOGOS = {
  visa: `<svg viewBox="0 0 64 20" xmlns="http://www.w3.org/2000/svg" aria-label="Visa">
    <text x="0" y="16" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="17" letter-spacing="0.3" fill="currentColor">VISA</text>
  </svg>`,
  amex: `<svg viewBox="0 0 64 20" xmlns="http://www.w3.org/2000/svg" aria-label="American Express">
    <text x="0" y="16" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="15" letter-spacing="0.2" fill="currentColor">AMEX</text>
  </svg>`,
  giro: `<svg viewBox="0 0 64 20" xmlns="http://www.w3.org/2000/svg" aria-label="Girokonto">
    <text x="0" y="16" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="15" letter-spacing="0.2" fill="currentColor">GIRO</text>
  </svg>`
};

let state = {
  theme: 'light',
  selectedCardId: 'amex',
  expenses: [],
  events: [],
  viewMonth: (() => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  })()
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      // Nur die persistenten Felder übernehmen (cards sind hartcodiert)
      state.theme          = p.theme          ?? state.theme;
      state.selectedCardId = p.selectedCardId ?? state.selectedCardId;
      state.expenses       = Array.isArray(p.expenses) ? p.expenses : [];
      state.events         = Array.isArray(p.events)   ? p.events   : [];
      state.viewMonth      = p.viewMonth      ?? state.viewMonth;

      // Falls alte Karten-IDs in Ausgaben sind, auf 'amex' mappen
      const validIds = new Set(CARDS.map(c => c.id));
      state.expenses.forEach(e => {
        if (!validIds.has(e.cardId)) e.cardId = 'amex';
      });
      if (!validIds.has(state.selectedCardId)) state.selectedCardId = 'amex';
    }
  } catch (e) { console.warn('load failed', e); }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      theme: state.theme,
      selectedCardId: state.selectedCardId,
      expenses: state.expenses,
      events: state.events,
      viewMonth: state.viewMonth
    }));
  } catch (e) { console.warn('save failed', e); }
}

function exportData() {
  const payload = {
    _meta: { app: 'nicole_tracker', version: 2, exportedAt: new Date().toISOString() },
    theme: state.theme,
    selectedCardId: state.selectedCardId,
    expenses: state.expenses,
    events: state.events,
    viewMonth: state.viewMonth
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = todayISO();
  a.href = url;
  a.download = `tracker-backup-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Backup heruntergeladen ✓');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const p = JSON.parse(ev.target.result);
      const expenses = Array.isArray(p.expenses) ? p.expenses : null;
      const events = Array.isArray(p.events) ? p.events : null;
      if (!expenses && !events) {
        alert('Datei enthält keine erkennbaren Daten.');
        return;
      }
      const summary = `Import: ${expenses ? expenses.length : 0} Ausgaben, ${events ? events.length : 0} Termine.\n\nAchtung: alle aktuellen Daten werden ersetzt. Fortfahren?`;
      if (!confirm(summary)) return;

      if (expenses) state.expenses = expenses;
      if (events) state.events = events;
      if (p.theme) state.theme = p.theme;
      if (p.selectedCardId) state.selectedCardId = p.selectedCardId;
      if (p.viewMonth) state.viewMonth = p.viewMonth;

      // Karten-IDs validieren (gleiche Logik wie loadState)
      const validIds = new Set(CARDS.map(c => c.id));
      state.expenses.forEach(e => { if (!validIds.has(e.cardId)) e.cardId = 'amex'; });
      if (!validIds.has(state.selectedCardId)) state.selectedCardId = 'amex';

      saveState();
      renderAll();
      showToast('Import erfolgreich ✓');
    } catch (err) {
      alert('Import fehlgeschlagen: ' + err.message);
    }
  };
  reader.readAsText(file);
}

const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const ICON_SUN  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.body.setAttribute('data-theme', state.theme);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.innerHTML = state.theme === 'light' ? ICON_MOON : ICON_SUN;
  // Browser-Farbleiste (mobil) ans Theme anpassen
  const meta = document.getElementById('metaThemeColor');
  if (meta) meta.setAttribute('content', state.theme === 'light' ? '#FFF2FB' : '#1A1030');
}

/* ---------------------------------------------------------
   FEEDBACK — Toast + Validierungs-Markierung
--------------------------------------------------------- */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('appToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// Markiert ein Pflichtfeld rot (mit kurzem Schütteln) und fokussiert es.
// Markierung verschwindet, sobald getippt wird.
function flagInvalid(el) {
  el.classList.remove('input-error');
  void el.offsetWidth; // Animation neu starten
  el.classList.add('input-error');
  el.focus();
  el.addEventListener('input', () => el.classList.remove('input-error'), { once: true });
}

document.getElementById('themeToggle').addEventListener('click', () => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  applyTheme();
  saveState();
});

document.getElementById('btnExport').addEventListener('click', exportData);
document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('importFileInput').click();
});
document.getElementById('importFileInput').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (file) importData(file);
  e.target.value = ''; // reset, damit dieselbe Datei nochmal gewählt werden kann
});

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const tab = t.dataset.tab;
    document.getElementById('tab-expenses').style.display = tab === 'expenses' ? '' : 'none';
    document.getElementById('tab-events').style.display = tab === 'events' ? '' : 'none';
    if (tab === 'events') renderWeeks();
  });
});

/* ---------------------------------------------------------
   KARTEN — Render der 3 festen Karten
--------------------------------------------------------- */
function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';

  CARDS.forEach(c => {
    // Was wird im angezeigten Monat ABGEBUCHT (=fertige Buchungen)
    const bookedTotal = getMonthExpenses(state.viewMonth, 'booking')
      .filter(e => e.cardId === c.id)
      .reduce((s, e) => s + e.amount, 0);

    // Käufe aus dem angezeigten Monat, die ERST SPÄTER abgebucht werden (= "noch unterwegs")
    const pendingTotal = getMonthExpenses(state.viewMonth, 'expense')
      .filter(e => e.cardId === c.id)
      .filter(e => computeBookingDate(e.cardId, e.date).slice(0, 7) > state.viewMonth)
      .reduce((s, e) => s + e.amount, 0);

    const div = document.createElement('div');
    div.className = 'cc zone-' + c.color + (state.selectedCardId === c.id ? ' selected' : '');
    div.innerHTML = `
      <span class="cc-sparkle">✦</span>
      <div class="cc-top">
        <div class="cc-type-name">${c.name}</div>
        <div class="cc-logo">${CARD_LOGOS[c.logo]}</div>
      </div>
      <div>
        <div class="cc-amount">${formatEUR(bookedTotal)}</div>
        <div class="cc-month">Abbuchung ${monthLabel(state.viewMonth)}</div>
        ${pendingTotal > 0 ? `<div class="cc-pending">+ ${formatEUR(pendingTotal)} folgt im nächsten Monat</div>` : ''}
      </div>
    `;
    div.addEventListener('click', () => {
      state.selectedCardId = c.id;
      saveState();
      renderCards();
      renderCardSelect();
    });
    grid.appendChild(div);
  });
}

function renderCardSelect() {
  const sel = document.getElementById('expCard');
  sel.innerHTML = '';
  CARDS.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    if (c.id === state.selectedCardId) opt.selected = true;
    sel.appendChild(opt);
  });
}

/* ---------------------------------------------------------
   AUSGABEN
--------------------------------------------------------- */

// Berechnet das Buchungsdatum (wann die Bank wirklich abbucht)
// basierend auf Karte und Ausgabedatum.
function computeBookingDate(cardId, expenseDateISO) {
  const [y, m, d] = expenseDateISO.split('-').map(Number);

  if (cardId === 'giro') {
    // Girokonto: direkt am gleichen Tag
    return expenseDateISO;
  }

  if (cardId === 'amex') {
    // Bis einschließlich 21. → Abbuchung am 22. desselben Monats
    // Ab 22. → Abbuchung am 22. des Folgemonats
    let bookY = y, bookM = m;
    if (d > 21) {
      bookM += 1;
      if (bookM > 12) { bookM = 1; bookY += 1; }
    }
    return bookY + '-' + String(bookM).padStart(2, '0') + '-22';
  }

  if (cardId === 'visa') {
    // Visa: 30 Tage nach Ausgabe
    const dateObj = new Date(y, m - 1, d);
    dateObj.setDate(dateObj.getDate() + 30);
    const by = dateObj.getFullYear();
    const bm = dateObj.getMonth() + 1;
    const bd = dateObj.getDate();
    return by + '-' + String(bm).padStart(2, '0') + '-' + String(bd).padStart(2, '0');
  }

  return expenseDateISO;
}

// Liefert Ausgaben für einen Monat.
// mode = 'expense'  → gefiltert nach Ausgabedatum (was man wann gekauft hat)
// mode = 'booking'  → gefiltert nach Buchungsdatum (was wann von der Karte abgeht)
function getMonthExpenses(yyyymm, mode = 'expense') {
  const matchesMonth = (e) => {
    if (mode === 'booking') {
      return computeBookingDate(e.cardId, e.date).startsWith(yyyymm);
    }
    return e.date.startsWith(yyyymm);
  };

  const direct = state.expenses.filter(matchesMonth);

  // Wiederkehrende Ausgaben (Abos): in passende Monate projizieren.
  // Wichtig: Im 'booking'-Modus muss auch der Vormonat als Kandidat geprüft
  // werden, weil z.B. Amex-Käufe ab dem 22. erst im Folgemonat abgebucht
  // werden (analog Visa mit 30-Tage-Versatz).
  const recurring = [];
  const candidateMonths = mode === 'booking' ? [prevMonth(yyyymm), yyyymm] : [yyyymm];

  state.expenses.forEach(e => {
    if (!e.recurring) return;
    const startMonth = e.date.slice(0, 7);

    for (const candMonth of candidateMonths) {
      // Vor Start-Monat gibt es noch keine Instanz; im Start-Monat selbst
      // ist die Original-Buchung bereits in `direct` enthalten (falls sie
      // dort hingehört).
      if (startMonth >= candMonth) continue;

      // Tag auf den letzten Tag des Zielmonats begrenzen — sonst entstehen
      // ungültige Daten wie "31. Februar" bei Abos vom 29.-31.
      const [cy, cm] = candMonth.split('-').map(Number);
      const lastDay = new Date(cy, cm, 0).getDate();
      const day = Math.min(Number(e.date.slice(8, 10)), lastDay);
      const projectedDate = candMonth + '-' + String(day).padStart(2, '0');
      const projected = {
        ...e,
        id: e.id + '_' + candMonth,
        date: projectedDate,
        recurringSource: e.id,
        isProjected: true
      };
      if (!matchesMonth(projected)) continue;
      // Dedup: pro Abo nur eine Projektion in den Ergebnissen
      if (recurring.some(r => r.recurringSource === e.id)) continue;
      recurring.push(projected);
    }
  });
  return [...direct, ...recurring];
}

function deleteExpense(id) {
  const exp = state.expenses.find(e => e.id === id);
  // Bei Abos deutlich warnen: es wird die komplette Serie entfernt,
  // nicht nur die angeklickte (ggf. projizierte) Instanz.
  const msg = exp && exp.recurring
    ? `Das Abo "${exp.desc}" komplett löschen?\nEs wird aus allen Monaten entfernt.`
    : 'Diese Ausgabe wirklich löschen?';
  if (!confirm(msg)) return;
  state.expenses = state.expenses.filter(e => e.id !== id);
  saveState();
  renderExpensesTab();
  showToast(exp && exp.recurring ? 'Abo gelöscht' : 'Ausgabe gelöscht');
}

function renderStats() {
  // Ausgaben nach Ausgabedatum (was wurde diesen Monat gekauft)
  const expenseItems = getMonthExpenses(state.viewMonth, 'expense');
  const expenseTotal = expenseItems.reduce((s, e) => s + e.amount, 0);
  const recurringTotal = expenseItems.filter(e => e.recurring || e.isProjected).reduce((s, e) => s + e.amount, 0);
  const count = expenseItems.length;

  // Buchungen nach Buchungsdatum (was wird diesen Monat tatsächlich abgebucht)
  const bookingItems = getMonthExpenses(state.viewMonth, 'booking');
  const bookingTotal = bookingItems.reduce((s, e) => s + e.amount, 0);

  const prev = prevMonth(state.viewMonth);
  const prevTotal = getMonthExpenses(prev, 'expense').reduce((s, e) => s + e.amount, 0);
  let trendLabel = '–';
  let trendClass = '';
  if (prevTotal > 0) {
    const diff = ((expenseTotal - prevTotal) / prevTotal) * 100;
    trendLabel = (diff >= 0 ? '+' : '') + diff.toFixed(0) + '%';
    trendClass = diff >= 0 ? 'stat-trend-up' : 'stat-trend-down';
  } else if (expenseTotal > 0) {
    trendLabel = 'neu';
  }

  document.getElementById('statsMonthMeta').textContent = monthLabel(state.viewMonth);

  // Eigener Anteil aus Ausgabe-Items aufsummieren (nur wenn Wert gesetzt)
  const eigenTotal = expenseItems
    .filter(e => e.eigenAmount && e.eigenAmount > 0)
    .reduce((s, e) => s + e.eigenAmount, 0);

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat zone-rosa">
      <div class="stat-label">Ausgegeben</div>
      <div class="stat-value">${formatEUR(expenseTotal)}</div>
    </div>
    <div class="stat stat-hero zone-buttermilk">
      <div class="stat-label">Abbuchung gesamt <span class="stat-spark">✦</span></div>
      <div class="stat-value">${formatEUR(bookingTotal)}</div>
    </div>
    <div class="stat zone-minze">
      <div class="stat-label">Mein Anteil</div>
      <div class="stat-value">${formatEUR(eigenTotal)}</div>
    </div>
    <div class="stat zone-violet">
      <div class="stat-label">vs. Vormonat</div>
      <div class="stat-value ${trendClass}">${trendLabel}</div>
    </div>
    <div class="stat zone-peach">
      <div class="stat-label">Buchungen</div>
      <div class="stat-value">${count}</div>
    </div>
  `;

  // Diagramm: nach Ausgaben (Kategorien)
  const byCat = {};
  expenseItems.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
  const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = sorted.length ? sorted[0][1] : 1;

  const chart = document.getElementById('categoryChart');
  if (sorted.length === 0) {
    chart.innerHTML = '<div class="empty">Daten erscheinen, sobald du Ausgaben hinzufügst</div>';
    return;
  }
  chart.innerHTML = sorted.map(([cat, val]) => {
    const pct = (val / max) * 100;
    return `
      <div class="bar-row">
        <div class="bar-cat">${escapeHtml(cat)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-amount">${formatEUR(val)}</div>
      </div>
    `;
  }).join('');
}

// Liefert das Intervall in Tagen für tagebasierte Wiederholungen, sonst null.
// monthly bleibt separat (kalender-basiert).
function recurrenceIntervalDays(rec) {
  if (!rec) return null;
  if (rec === 'daily') return 1;
  if (rec === 'weekly') return 7;
  const m = /^every-(\d+)([dw])$/.exec(rec);
  if (!m) return null;
  const n = parseInt(m[1], 10);
  return m[2] === 'w' ? n * 7 : n;
}

function recurrenceLabel(rec) {
  if (!rec) return '';
  if (rec === 'daily') return 'täglich';
  if (rec === 'weekly') return 'wöchentlich';
  if (rec === 'monthly') return 'monatlich';
  const m = /^every-(\d+)([dw])$/.exec(rec);
  if (!m) return '';
  const n = parseInt(m[1], 10);
  return m[2] === 'w' ? `alle ${n} Wochen` : `alle ${n} Tage`;
}

// Prüft ob ein Termin an einem bestimmten ISO-Datum auftritt
// Berücksichtigt Wiederholungen UND Overrides (einzelne gelöschte/verschobene Instanzen)
function eventOccursOn(ev, isoDate) {
  // 1. Wenn diese Instanz explizit gelöscht wurde → false
  if (ev.overrides && ev.overrides[isoDate] === null) return false;

  // 2. Wenn eine andere Instanz auf dieses Datum VERSCHOBEN wurde → true
  if (ev.overrides) {
    for (const [origDate, override] of Object.entries(ev.overrides)) {
      if (override && override.date === isoDate) return true;
    }
  }

  // 3. Reguläre Wiederholungs-Logik
  // Termin kann nicht vor seinem Startdatum auftreten
  if (isoDate < ev.date) return false;

  // Direkter Match (am Original-Datum)
  if (ev.date === isoDate) {
    // Aber nur wenn nicht selbst verschoben
    if (ev.overrides && ev.overrides[isoDate] && ev.overrides[isoDate].date && ev.overrides[isoDate].date !== isoDate) return false;
    return true;
  }

  // Keine Wiederholung → nur am Startdatum
  if (!ev.recurrence) return false;

  const [sy, sm, sd] = ev.date.split('-').map(Number);
  const [cy, cm, cd] = isoDate.split('-').map(Number);

  let isRecurringMatch = false;
  const intervalDays = recurrenceIntervalDays(ev.recurrence);
  if (intervalDays) {
    const start = new Date(sy, sm - 1, sd);
    const cur = new Date(cy, cm - 1, cd);
    const diffDays = Math.round((cur - start) / 86400000);
    isRecurringMatch = diffDays > 0 && diffDays % intervalDays === 0;
  } else if (ev.recurrence === 'monthly') {
    if (cd === sd && ((cy > sy) || (cy === sy && cm > sm))) isRecurringMatch = true;
  }

  if (!isRecurringMatch) return false;

  // Match aus Recurrence — aber wenn diese Instanz auf ein anderes Datum verschoben wurde, hier nicht zeigen
  if (ev.overrides && ev.overrides[isoDate] && ev.overrides[isoDate].date && ev.overrides[isoDate].date !== isoDate) return false;

  return true;
}

// Liefert für ein Datum die "effektiven" Termin-Werte (mit Override-Anwendung)
function resolveEventForDate(ev, isoDate) {
  // Standard-Werte aus dem Original-Termin
  let resolved = {
    ...ev,
    occurrenceDate: isoDate,    // an welchem Tag erscheint die Instanz
    sourceDate: isoDate          // welcher Override-Key gilt
  };

  // Falls eine andere Instanz auf dieses Datum verschoben wurde → diese Werte nehmen
  if (ev.overrides) {
    for (const [origDate, override] of Object.entries(ev.overrides)) {
      if (override && override.date === isoDate) {
        resolved = { ...resolved, ...override, sourceDate: origDate };
        return resolved;
      }
    }
    // Override für genau dieses Datum (geändert ohne Verschiebung)
    if (ev.overrides[isoDate] && ev.overrides[isoDate] !== null) {
      resolved = { ...resolved, ...ev.overrides[isoDate], sourceDate: isoDate };
    }
  }

  return resolved;
}

function renderWeeks() {
  const container = document.getElementById('weeksContainer');
  container.innerHTML = '';

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const startOfWeek = new Date(today);
  const day = startOfWeek.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  startOfWeek.setDate(startOfWeek.getDate() + diff);

  const weekNames = ['Diese Woche', 'Nächste Woche', 'Übernächste Woche'];

  for (let w = 0; w < 3; w++) {
    const weekStart = new Date(startOfWeek);
    weekStart.setDate(weekStart.getDate() + w * 7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);

    const block = document.createElement('div');
    block.className = 'week';

    const nameParts = weekNames[w].split(' ');
    block.innerHTML = `
      <div class="week-head">
        <h3 class="week-name ${w === 0 ? 'current' : ''}">
          ${nameParts[0]} <em>${nameParts[1]}</em>
        </h3>
        <span class="week-range">${formatDateShort(dateToLocalISO(weekStart))} – ${formatDateShort(dateToLocalISO(weekEnd))}</span>
      </div>
    `;

    const grid = document.createElement('div');
    grid.className = 'day-grid';

    const dayNames = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

    for (let d = 0; d < 7; d++) {
      const dayDate = new Date(weekStart);
      dayDate.setDate(dayDate.getDate() + d);
      const isoDate = dateToLocalISO(dayDate);
      const isToday = dayDate.getTime() === today.getTime();

      // Liefert alle Termin-Instanzen die an diesem Tag erscheinen sollen
      // Für jede Instanz die effektiven Werte (Override-aware) berechnen
      const events = state.events
        .filter(e => eventOccursOn(e, isoDate))
        .map(e => resolveEventForDate(e, isoDate))
        .sort((a, b) => (a.time || 'zz').localeCompare(b.time || 'zz'));

      const col = document.createElement('div');
      col.className = 'day' + (isToday ? ' today' : '');
      col.innerHTML = `
        <div class="day-head">
          <span class="day-name">${dayNames[d]}</span>
          <span class="day-num">${dayDate.getDate()}</span>
        </div>
      `;

      const stack = document.createElement('div');
      stack.className = 'events-stack';
      events.forEach(ev => {
        const chip = document.createElement('div');
        chip.className = 'evt';
        chip.style.setProperty('--evt-color', COLOR_VAR[ev.color] || COLOR_VAR.minze);
        chip.style.setProperty('--evt-tint', COLOR_TINT_VAR[ev.color] || COLOR_TINT_VAR.minze);
        const recLabel = ev.recurrence ? '↻ ' + recurrenceLabel(ev.recurrence) : '';
        chip.innerHTML = `
          ${ev.time ? `<div class="evt-time">${ev.time}</div>` : ''}
          <div class="evt-text">${escapeHtml(ev.text)}</div>
          ${recLabel ? `<div class="evt-recurring">${recLabel}</div>` : ''}
        `;
        chip.addEventListener('click', () => openEventModal(ev));
        stack.appendChild(chip);
      });
      col.appendChild(stack);

      const addBtn = document.createElement('button');
      addBtn.className = 'day-add';
      addBtn.textContent = '+';
      addBtn.title = 'Termin an diesem Tag hinzufügen';
      addBtn.addEventListener('click', () => {
        document.getElementById('evtDate').value = isoDate;
        document.getElementById('evtText').focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      col.appendChild(addBtn);

      grid.appendChild(col);
    }

    block.appendChild(grid);
    container.appendChild(block);
  }
}

// === Termin-Modal: Anzeigen / Bearbeiten / Löschen — mit Override-Support ===
let modalContext = null; // { event, occurrenceDate, mode: 'view'|'edit', scope: 'single'|'series' }

function openEventModal(resolvedEv) {
  // Original-Event aus state finden (resolvedEv kann Override-Werte enthalten)
  const original = state.events.find(e => e.id === resolvedEv.id);
  if (!original) return;

  modalContext = {
    event: original,
    occurrenceDate: resolvedEv.occurrenceDate,
    sourceDate: resolvedEv.sourceDate,
    resolved: resolvedEv,
    mode: 'view',
    scope: null
  };
  renderEventModal();
  document.getElementById('eventModal').classList.add('open');
}

      ${recText ? `

    `;

    if (isRecurring) {

        <button class="btn btn-primary" id="actEditSeries">Serie bearbeiten</button>
      `;
      document.getElementById('actDelSingle').onclick = () => deleteOccurrence();
      document.getElementById('actDelSeries').onclick = () => deleteSeries();
      document.getElementById('actEditSingle').onclick = () => switchToEdit('single');
      document.getElementById('actEditSeries').onclick = () => switchToEdit('series');
    } else {
      actions.innerHTML = `
        <button class="btn btn-danger" id="actDelSingle">Löschen</button>
        <button class="btn btn-ghost" onclick="closeEventModal()">Schließen</button>
        <button class="btn btn-primary" id="actEditSingle">Bearbeiten</button>
      `;
      document.getElementById('actDelSingle').onclick = () => deleteSeries(); // bei Single = ganz löschen
      document.getElementById('actEditSingle').onclick = () => switchToEdit('series'); // bei Single = direkt am Original
    }
  } else if (ctx.mode === 'edit') {
    const scopeLabel = ctx.scope === 'single' ? 'Diesen Termin bearbeiten' : 'Serie bearbeiten';
    title.textContent = scopeLabel;
    body.innerHTML = ctx.scope === 'single'
      ? `<div class="modal-note">Änderungen gelten nur für ${formatDateLong(ctx.occurrenceDate)}.</div>`
      : (isRecurring ? `<div class="modal-note">Änderungen gelten für die gesamte Serie.</div>` : '');

    editForm.style.display = 'block';

    // Felder mit aktuellen aufgelösten Werten füllen
    document.getElementById('evtEditText').value = ctx.resolved.text;
    document.getElementById('evtEditDate').value = ctx.scope === 'single' ? ctx.occurrenceDate : ctx.event.date;
    document.getElementById('evtEditTime').value = ctx.resolved.time || '';
    const curColor = ctx.resolved.color || 'minze';
    document.querySelectorAll('#evtEditColorPicker .evt-color-pick').forEach(b => {
      b.classList.toggle('active', b.dataset.color === curColor);
    });

    actions.innerHTML = `
      <button class="btn btn-ghost" id="actCancel">Abbrechen</button>
      <button class="btn btn-primary" id="actSave">Speichern</button>
    `;
    document.getElementById('actCancel').onclick = () => { ctx.mode = 'view'; renderEventModal(); };
    document.getElementById('actSave').onclick = () => saveEdit();
  }
}

// Farb-Picker im Edit-Modal
document.querySelectorAll('#evtEditColorPicker .evt-color-pick').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#evtEditColorPicker .evt-color-pick').forEach(x =>
      x.classList.toggle('active', x === b)
    );
  });
});

function switchToEdit(scope) {
  modalContext.mode = 'edit';
  modalContext.scope = scope;
  renderEventModal();
}

function saveEdit() {
  const ctx = modalContext;
  const newText = document.getElementById('evtEditText').value.trim();
  const newDate = document.getElementById('evtEditDate').value;
  const newTime = document.getElementById('evtEditTime').value || null;
  const activeColorBtn = document.querySelector('#evtEditColorPicker .evt-color-pick.active');
  const newColor = activeColorBtn ? activeColorBtn.dataset.color : (ctx.resolved.color || 'minze');

  if (!newText) { flagInvalid(document.getElementById('evtEditText')); return; }
  if (!newDate) { flagInvalid(document.getElementById('evtEditDate')); return; }

  if (ctx.scope === 'series' || !ctx.event.recurrence) {
    // Ganze Serie / Einzeltermin: Original ändern
    ctx.event.text = newText;
    ctx.event.date = newDate;
    ctx.event.time = newTime;
    ctx.event.color = newColor;
  } else {
    // Nur diese Instanz: Override anlegen
    if (!ctx.event.overrides) ctx.event.overrides = {};
    ctx.event.overrides[ctx.sourceDate] = {
      text: newText,
      date: newDate,
      time: newTime,
      color: newColor
    };
  }

  saveState();
  closeEventModal();
  renderWeeks();
  showToast('Termin aktualisiert ✓');
}

function deleteOccurrence() {
  const ctx = modalContext;
  if (!confirm(`Nur diesen Termin am ${formatDateLong(ctx.occurrenceDate)} löschen?\nDie Serie bleibt erhalten.`)) return;
  if (!ctx.event.overrides) ctx.event.overrides = {};
  ctx.event.overrides[ctx.sourceDate] = null; // null = gelöscht
  saveState();
  closeEventModal();
  renderWeeks();
}

function deleteSeries() {
  const ctx = modalContext;
  const isRec = !!ctx.event.recurrence;
  if (isRec && !confirm(`Wiederkehrenden Termin "${ctx.event.text}" wirklich löschen?\nAlle Wiederholungen werden entfernt.`)) return;
  if (!isRec && !confirm('Diesen Termin wirklich löschen?')) return;
  state.events = state.events.filter(e => e.id !== ctx.event.id);
  saveState();
  closeEventModal();
  renderWeeks();
}

function closeEventModal() {
  document.getElementById('eventModal').classList.remove('open');
  modalContext = null;
}
document.getElementById('eventModal').addEventListener('click', (e) => {
  if (e.target.id === 'eventModal') closeEventModal();
});

/* ---------------------------------------------------------
   TASTATUR — Enter speichert, Escape schließt das Modal
--------------------------------------------------------- */
function enterSubmits(sectionId, buttonId) {
  document.getElementById(sectionId).addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches('input')) {
      e.preventDefault();
      document.getElementById(buttonId).click();
    }
  });
}
enterSubmits('expenseFormSection', 'addExpenseBtn');
enterSubmits('eventFormSection', 'addEventBtn');

document.getElementById('eventModal').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('input')) {
    e.preventDefault();
    const save = document.getElementById('actSave');
    if (save) save.click();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('eventModal').classList.contains('open')) {
    closeEventModal();
  }
});

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */
function todayISO() {
  // Lokales Datum, NICHT UTC — sonst Timezone-Versatz
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function dateToLocalISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function formatEUR(n) {
  return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(n);
}
function formatDateShort(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
}
function formatDateLong(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function monthLabel(yyyymm) {
  const [y, m] = yyyymm.split('-');
  const d = new Date(parseInt(y), parseInt(m) - 1, 1);
  return d.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
}
function prevMonth(yyyymm) {
  let [y, m] = yyyymm.split('-').map(Number);
  m -= 1;
  if (m < 1) { m = 12; y -= 1; }
  return y + '-' + String(m).padStart(2, '0');
}
function nextMonth(yyyymm) {
  let [y, m] = yyyymm.split('-').map(Number);
  m += 1;
  if (m > 12) { m = 1; y += 1; }
  return y + '-' + String(m).padStart(2, '0');
}

function renderAll() {
  applyTheme();
  renderExpensesTab();
}

/* ---------------------------------------------------------
   AUTO-UPDATE — prüft beim Öffnen, ob auf GitHub Pages eine
   neue Version liegt, und lädt die App dann einmal neu.
   Nötig, weil iOS Home-Screen-Webapps den alten Stand
   einfrieren und nie von selbst nachladen.
   Nutzerdaten (nicole_tracker_v2) bleiben davon unberührt.
--------------------------------------------------------- */
const VERSION_HASH_KEY = 'nicole_tracker_version_hash';
const JUST_UPDATED_KEY = 'nicole_tracker_just_updated';
let lastUpdateCheck = 0;

function hashText(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
  return String(h);
}

async function checkForUpdate() {
  if (!location.protocol.startsWith('http')) return; // lokal geöffnete Datei: nichts tun
  const now = Date.now();
  if (now - lastUpdateCheck < 60000) return; // höchstens 1x pro Minute
  lastUpdateCheck = now;
  try {
    // Cache-Buster: iOS-Home-Screen-Webapps (WKWebView) ignorieren `no-store`
    // teilweise und liefern die alte Datei aus dem Cache → der Hash bliebe
    // gleich und die App würde nie aktualisieren. Eine eindeutige Query-URL
    // erzwingt einen echten frischen Abruf von GitHub Pages.
    const base = location.href.split('#')[0].split('?')[0];
    const res = await fetch(base + '?_cb=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const h = hashText(await res.text());
    const stored = localStorage.getItem(VERSION_HASH_KEY);
    if (!stored) { localStorage.setItem(VERSION_HASH_KEY, h); return; }
    if (stored === h) return;

    localStorage.setItem(VERSION_HASH_KEY, h);
    // Nicht mitten in einer Eingabe oder im offenen Modal neu laden
    const typing = ['expDesc', 'expAmount', 'expEigen', 'evtText'].some(id => {
      const el = document.getElementById(id);
      return el && el.value.trim() !== '';
    });
    if (typing || document.getElementById('eventModal').classList.contains('open')) {
      showToast('Neue Version verfügbar — App kurz schließen & öffnen');
      return;
    }
    sessionStorage.setItem(JUST_UPDATED_KEY, '1');
    location.reload();
  } catch (e) { /* offline o.ä. — beim nächsten Öffnen erneut versuchen */ }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkForUpdate();
});
// iOS holt die Webapp oft aus dem Speicher zurück statt neu zu laden
window.addEventListener('pageshow', (e) => { if (e.persisted) checkForUpdate(); });

loadState();
document.getElementById('expDate').value = todayISO();
document.getElementById('evtDate').value = todayISO();
renderAll();
checkForUpdate();
if (sessionStorage.getItem(JUST_UPDATED_KEY)) {
  sessionStorage.removeItem(JUST_UPDATED_KEY);
  showToast('App aktualisiert ✓');
}
</script>
